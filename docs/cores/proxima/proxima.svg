<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="DejaVu Sans, sans-serif" font-size="12">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="900" height="380" fill="#ffffff"/>
<text x="450" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Proxima 1 (plan): one SIMT core of the GPU Hyades</text>
<text x="450" y="42" text-anchor="middle" font-size="11" fill="#555">one fetch and decode for a warp, the same instruction in every lane; 4 warps × 4 threads to start</text>
<g fill="#fbeaea" stroke="#8a2323">
<rect x="20" y="70" width="150" height="90" rx="6"/><rect x="190" y="70" width="140" height="90" rx="6"/><rect x="350" y="70" width="140" height="90" rx="6"/>
<rect x="510" y="60" width="370" height="200" rx="6"/><rect x="20" y="200" width="310" height="60" rx="6"/><rect x="20" y="290" width="860" height="50" rx="6"/>
</g>
<g text-anchor="middle" fill="#222">
<text x="95" y="92" font-weight="bold">Warp scheduler</text><text x="95" y="110" font-size="11">picks a ready warp</text><text x="95" y="126" font-size="11">each cycle (round robin)</text><text x="95" y="142" font-size="11">a waiting warp is skipped</text>
<text x="260" y="92" font-weight="bold">Fetch + decode</text><text x="260" y="110" font-size="11">one per cycle</text><text x="260" y="126" font-size="11">Sol's decoder (RV32)</text><text x="260" y="142" font-size="11">+ GPU instructions</text>
<text x="420" y="92" font-weight="bold">Registers</text><text x="420" y="110" font-size="11">32 × 32 bits</text><text x="420" y="126" font-size="11">per thread</text><text x="420" y="142" font-size="11">(a memory, not FFs)</text>
<text x="695" y="82" font-weight="bold">Lanes: one per thread of the warp</text>
<text x="175" y="222" font-weight="bold">Thread control</text><text x="175" y="240" font-size="11">thread mask (tmc), wspawn, split/join stack</text><text x="175" y="254" font-size="11">(divergence), barrier (bar)</text>
<text x="450" y="312" font-weight="bold">Memory: per-lane requests, serialized at first (combining comes later); the RAM shared with the CPU</text>
<text x="450" y="330" font-size="11">Hyades = several Proxima cores + their memory port + control registers at 0x2000_0000</text>
</g>
<g fill="#ffffff" stroke="#8a2323">
<rect x="525" y="100" width="80" height="140" rx="4"/><rect x="615" y="100" width="80" height="140" rx="4"/><rect x="705" y="100" width="80" height="140" rx="4"/><rect x="795" y="100" width="75" height="140" rx="4"/>
</g>
<g text-anchor="middle" font-size="11" fill="#222">
<text x="565" y="122">lane 0</text><text x="565" y="146">ALU</text><text x="565" y="166">MUL</text><text x="565" y="186">branch</text><text x="565" y="206">LSU</text>
<text x="655" y="122">lane 1</text><text x="655" y="146">ALU</text><text x="655" y="166">MUL</text><text x="655" y="186">branch</text><text x="655" y="206">LSU</text>
<text x="745" y="122">lane 2</text><text x="745" y="146">ALU</text><text x="745" y="166">MUL</text><text x="745" y="186">branch</text><text x="745" y="206">LSU</text>
<text x="832" y="122">lane 3</text><text x="832" y="146">ALU</text><text x="832" y="166">MUL</text><text x="832" y="186">branch</text><text x="832" y="206">LSU</text>
<text x="695" y="254">from rtl/common: alu, branch_unit, lsu, muldiv without the divider</text>
</g>
<g stroke="#333">
<line x1="170" y1="115" x2="190" y2="115" marker-end="url(#a)"/><line x1="330" y1="115" x2="350" y2="115" marker-end="url(#a)"/><line x1="490" y1="115" x2="510" y2="115" marker-end="url(#a)"/>
<line x1="330" y1="230" x2="510" y2="230" marker-end="url(#a)"/><line x1="695" y1="260" x2="695" y2="290" marker-end="url(#a)"/>
</g>
<text x="450" y="368" text-anchor="middle" font-size="11" fill="#8a4a23">a plan for stage 4: sizes are starting points, nothing here is measured</text>
</svg>
