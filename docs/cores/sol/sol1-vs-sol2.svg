<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="DejaVu Sans, sans-serif" font-size="12">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="860" height="300" fill="#ffffff"/>
<text x="430" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Sol 1 → Sol 2: what changed</text>
<text x="430" y="42" text-anchor="middle" font-size="11" fill="#555">same RTL (rtl/sol/core_pipe.sv), different parameters; grey = unchanged</text>
<g font-size="12">
<!-- stages -->
<rect x="30" y="70" width="120" height="60" rx="6" fill="#eeeeee" stroke="#999"/><text x="90" y="98" text-anchor="middle">IF</text><text x="90" y="114" text-anchor="middle" font-size="10" fill="#555">fetch queue (2)</text>
<rect x="190" y="70" width="120" height="60" rx="6" fill="#eeeeee" stroke="#999"/><text x="250" y="98" text-anchor="middle">ID</text>
<rect x="350" y="70" width="160" height="60" rx="6" fill="#fff4d6" stroke="#b58900" stroke-width="2"/><text x="430" y="94" text-anchor="middle" font-weight="bold">EX: muldiv</text><text x="430" y="112" text-anchor="middle" font-size="11">MUL_BITS 1 → 4</text>
<rect x="550" y="70" width="120" height="60" rx="6" fill="#eeeeee" stroke="#999"/><text x="610" y="98" text-anchor="middle">MEM</text>
<rect x="710" y="70" width="120" height="60" rx="6" fill="#eeeeee" stroke="#999"/><text x="770" y="98" text-anchor="middle">WB</text>
<line x1="150" y1="100" x2="190" y2="100" stroke="#333" marker-end="url(#a)"/>
<line x1="310" y1="100" x2="350" y2="100" stroke="#333" marker-end="url(#a)"/>
<line x1="510" y1="100" x2="550" y2="100" stroke="#333" marker-end="url(#a)"/>
<line x1="670" y1="100" x2="710" y2="100" stroke="#333" marker-end="url(#a)"/>
<!-- optional predictor -->
<rect x="30" y="160" width="160" height="50" rx="6" fill="#ffffff" stroke="#8a4a23" stroke-dasharray="5,4"/><text x="110" y="182" text-anchor="middle" fill="#8a4a23">bpred (BP = 1)</text><text x="110" y="198" text-anchor="middle" font-size="10" fill="#8a4a23">built, off by default</text>
<line x1="90" y1="160" x2="90" y2="130" stroke="#8a4a23" stroke-dasharray="4,3" marker-end="url(#a)"/>
<!-- detail of the multiplier -->
<rect x="250" y="160" width="580" height="120" rx="6" fill="#fffbf0" stroke="#b58900"/>
<text x="540" y="182" text-anchor="middle" font-weight="bold">one multiply iteration</text>
<text x="400" y="204" text-anchor="middle">Sol 1: 1 multiplier bit</text>
<text x="400" y="222" text-anchor="middle" font-size="11">hi + (b[0] ? a : 0), shift by 1</text>
<text x="400" y="240" text-anchor="middle" font-size="11">MULW: 34 cycles, MUL/MULH: 66</text>
<text x="400" y="258" text-anchor="middle" font-size="11">adder shared with the divider</text>
<text x="680" y="204" text-anchor="middle">Sol 2: 4 multiplier bits</text>
<text x="680" y="222" text-anchor="middle" font-size="11">hi + Σ b[j]·a·2^j (j &lt; 4), shift by 4</text>
<text x="680" y="240" text-anchor="middle" font-size="11">MULW: 10 cycles, MUL/MULH: 18</text>
<text x="680" y="258" text-anchor="middle" font-size="11">own carry-save sum; divider unchanged</text>
<line x1="540" y1="196" x2="540" y2="268" stroke="#ccc"/>
<line x1="430" y1="130" x2="430" y2="160" stroke="#b58900" marker-end="url(#a)"/>
</g>
</svg>
