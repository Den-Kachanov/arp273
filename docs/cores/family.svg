<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="DejaVu Sans, sans-serif" font-size="12">
<rect width="900" height="470" fill="#ffffff"/>
<text x="450" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">The arp273 family of cores (ADR 015)</text>
<text x="450" y="42" text-anchor="middle" font-size="11" fill="#555">named after classes of stars, from hot and luminous (O) to small and frugal (M); boxes are not to scale</text>
<!-- Sol -->
<rect x="20" y="60" width="200" height="380" rx="8" fill="#fdf6e3" stroke="#b58900"/>
<text x="120" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5c00">Sol (G)</text>
<text x="120" y="100" text-anchor="middle" fill="#333">in-order, 5 stages, RV64IM</text>
<text x="120" y="116" text-anchor="middle" fill="#2a7a2a" font-weight="bold">built: Sol 1, Sol 2</text>
<g font-size="11" fill="#333">
<rect x="40" y="130" width="160" height="22" fill="#eee8d5" stroke="#999"/><text x="120" y="145" text-anchor="middle">IF  (1 instruction)</text>
<rect x="40" y="156" width="160" height="22" fill="#eee8d5" stroke="#999"/><text x="120" y="171" text-anchor="middle">ID  decode, read regs</text>
<rect x="40" y="182" width="160" height="22" fill="#eee8d5" stroke="#999"/><text x="120" y="197" text-anchor="middle">EX  ALU | muldiv</text>
<rect x="40" y="208" width="160" height="22" fill="#eee8d5" stroke="#999"/><text x="120" y="223" text-anchor="middle">MEM data request</text>
<rect x="40" y="234" width="160" height="22" fill="#eee8d5" stroke="#999"/><text x="120" y="249" text-anchor="middle">WB  write, CSR, traps</text>
<text x="120" y="290" text-anchor="middle">lowest energy per operation</text>
<text x="120" y="306" text-anchor="middle">at its performance</text>
<text x="120" y="340" text-anchor="middle">Sol 1: CoreMark/MHz 1.36</text>
<text x="120" y="356" text-anchor="middle">Sol 2: CoreMark/MHz 1.96</text>
<text x="120" y="372" text-anchor="middle">(simulation, BRAM)</text>
<text x="120" y="410" text-anchor="middle">rtl/sol + rtl/common</text>
</g>
<!-- Spica -->
<rect x="240" y="60" width="200" height="380" rx="8" fill="#eaf1fb" stroke="#23518a"/>
<text x="340" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#12305e">Spica (B)</text>
<text x="340" y="100" text-anchor="middle" fill="#333">out-of-order, 2-wide, RV64</text>
<text x="340" y="116" text-anchor="middle" fill="#8a4a23" font-weight="bold">planned (stage 5)</text>
<g font-size="11" fill="#333">
<rect x="260" y="130" width="160" height="22" fill="#d6e4f5" stroke="#999"/><text x="340" y="145" text-anchor="middle">fetch 2, predict</text>
<rect x="260" y="156" width="160" height="22" fill="#d6e4f5" stroke="#999"/><text x="340" y="171" text-anchor="middle">decode 2, rename</text>
<rect x="260" y="182" width="160" height="22" fill="#d6e4f5" stroke="#999"/><text x="340" y="197" text-anchor="middle">1 issue queue</text>
<rect x="260" y="208" width="75" height="22" fill="#d6e4f5" stroke="#999"/><text x="297" y="223" text-anchor="middle">2 ALU</text>
<rect x="345" y="208" width="75" height="22" fill="#d6e4f5" stroke="#999"/><text x="382" y="223" text-anchor="middle">MUL, DIV</text>
<rect x="260" y="234" width="160" height="22" fill="#d6e4f5" stroke="#999"/><text x="340" y="249" text-anchor="middle">1 load/store port</text>
<rect x="260" y="260" width="160" height="22" fill="#d6e4f5" stroke="#999"/><text x="340" y="275" text-anchor="middle">ROB 32, commit 2</text>
<text x="340" y="310" text-anchor="middle">the RTL of Naos with</text>
<text x="340" y="326" text-anchor="middle">smaller parameters</text>
<text x="340" y="410" text-anchor="middle">rtl/spica-naos (later)</text>
</g>
<!-- Naos -->
<rect x="460" y="60" width="200" height="380" rx="8" fill="#eef0fd" stroke="#2a3a9a"/>
<text x="560" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a2470">Naos (O)</text>
<text x="560" y="100" text-anchor="middle" fill="#333">out-of-order, 4-wide, RV64</text>
<text x="560" y="116" text-anchor="middle" fill="#8a4a23" font-weight="bold">planned (stage 5+)</text>
<g font-size="11" fill="#333">
<rect x="480" y="130" width="160" height="22" fill="#dde1fb" stroke="#999"/><text x="560" y="145" text-anchor="middle">fetch 4, predict</text>
<rect x="480" y="156" width="160" height="22" fill="#dde1fb" stroke="#999"/><text x="560" y="171" text-anchor="middle">decode 4, rename</text>
<rect x="480" y="182" width="160" height="22" fill="#dde1fb" stroke="#999"/><text x="560" y="197" text-anchor="middle">3 issue queues</text>
<rect x="480" y="208" width="48" height="22" fill="#dde1fb" stroke="#999"/><text x="504" y="223" text-anchor="middle">3 ALU</text>
<rect x="532" y="208" width="52" height="22" fill="#dde1fb" stroke="#999"/><text x="558" y="223" text-anchor="middle">MUL</text>
<rect x="588" y="208" width="52" height="22" fill="#dde1fb" stroke="#999"/><text x="614" y="223" text-anchor="middle">DIV</text>
<rect x="480" y="234" width="160" height="22" fill="#dde1fb" stroke="#999"/><text x="560" y="249" text-anchor="middle">2 load/store ports</text>
<rect x="480" y="260" width="160" height="22" fill="#dde1fb" stroke="#999"/><text x="560" y="275" text-anchor="middle">ROB 96, commit 4</text>
<text x="560" y="310" text-anchor="middle">highest performance</text>
<text x="560" y="410" text-anchor="middle">rtl/spica-naos (later)</text>
</g>
<!-- Proxima -->
<rect x="680" y="60" width="200" height="380" rx="8" fill="#fbeaea" stroke="#8a2323"/>
<text x="780" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#5e1212">Proxima (M)</text>
<text x="780" y="100" text-anchor="middle" fill="#333">SIMT core of the GPU, RV32</text>
<text x="780" y="116" text-anchor="middle" fill="#8a4a23" font-weight="bold">planned (stage 3)</text>
<g font-size="11" fill="#333">
<rect x="700" y="130" width="160" height="22" fill="#f5d6d6" stroke="#999"/><text x="780" y="145" text-anchor="middle">warp scheduler</text>
<rect x="700" y="156" width="160" height="22" fill="#f5d6d6" stroke="#999"/><text x="780" y="171" text-anchor="middle">one fetch, one decode</text>
<rect x="700" y="182" width="160" height="22" fill="#f5d6d6" stroke="#999"/><text x="780" y="197" text-anchor="middle">registers per thread</text>
<rect x="700" y="208" width="36" height="22" fill="#f5d6d6" stroke="#999"/><text x="718" y="223" text-anchor="middle">lane</text>
<rect x="741" y="208" width="36" height="22" fill="#f5d6d6" stroke="#999"/><text x="759" y="223" text-anchor="middle">lane</text>
<rect x="782" y="208" width="36" height="22" fill="#f5d6d6" stroke="#999"/><text x="800" y="223" text-anchor="middle">lane</text>
<rect x="823" y="208" width="36" height="22" fill="#f5d6d6" stroke="#999"/><text x="841" y="223" text-anchor="middle">lane</text>
<rect x="700" y="234" width="160" height="22" fill="#f5d6d6" stroke="#999"/><text x="780" y="249" text-anchor="middle">memory (per lane)</text>
<text x="780" y="290" text-anchor="middle">built from Sol's decoder,</text>
<text x="780" y="306" text-anchor="middle">ALU and LSU</text>
<text x="780" y="340" text-anchor="middle">many copies make</text>
<text x="780" y="356" text-anchor="middle">the GPU Hyades</text>
<text x="780" y="410" text-anchor="middle">rtl/proxima (later)</text>
</g>
</svg>
