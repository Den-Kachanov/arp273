<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 590" width="1140" height="590" font-family="DejaVu Sans, sans-serif" font-size="13">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="1140" height="590" fill="#ffffff"/>
<text x="570" y="24" text-anchor="middle" fill="#222" font-size="16" font-weight="bold">How the modules connect in the single-cycle core</text>
<text x="570" y="42" text-anchor="middle" fill="#555" font-size="11">solid frame: a separate module in rtl/core; dashed: logic inside core.sv (PC, muxes) or memory outside the core</text>
<rect x="20" y="230" width="80" height="50" rx="6" fill="#f5f5f5" stroke="#777777" stroke-dasharray="6,4"/>
<text x="60.0" y="248" text-anchor="middle" font-weight="bold" fill="#333333">PC</text>
<text x="60.0" y="266" text-anchor="middle" fill="#555" font-size="11">register</text>
<rect x="130" y="230" width="130" height="50" rx="6" fill="#f5f5f5" stroke="#777777" stroke-dasharray="6,4"/>
<text x="195.0" y="248" text-anchor="middle" font-weight="bold" fill="#333333">instr. memory</text>
<text x="195.0" y="266" text-anchor="middle" fill="#555" font-size="11">comb. read</text>
<rect x="310" y="70" width="200" height="76" rx="6" fill="#f3f7ee" stroke="#4b6b2f"/>
<text x="410.0" y="88" text-anchor="middle" font-weight="bold" fill="#2f4a1b">decoder</text>
<text x="410.0" y="106" text-anchor="middle" fill="#555" font-size="11">control: alu_op, word, imm_sel,</text>
<text x="410.0" y="121" text-anchor="middle" fill="#555" font-size="11">a_sel, b_sel, wb_sel, we, mem, branch</text>
<rect x="310" y="170" width="200" height="56" rx="6" fill="#eef4fb" stroke="#33597f"/>
<text x="410.0" y="188" text-anchor="middle" font-weight="bold" fill="#1d3b5c">imm_gen</text>
<text x="410.0" y="206" text-anchor="middle" fill="#555" font-size="11">imm_o (XLEN)</text>
<rect x="310" y="250" width="200" height="90" rx="6" fill="#f5f5f5" stroke="#777777"/>
<text x="410.0" y="268" text-anchor="middle" font-weight="bold" fill="#333333">regfile</text>
<text x="410.0" y="286" text-anchor="middle" fill="#555" font-size="11">rs1: inst[19:15], rs2: inst[24:20]</text>
<text x="410.0" y="301" text-anchor="middle" fill="#555" font-size="11">rd: inst[11:7]</text>
<rect x="570" y="230" width="56" height="40" rx="6" fill="#f5f5f5" stroke="#777777" stroke-dasharray="6,4"/>
<text x="598.0" y="248" text-anchor="middle" font-weight="bold" fill="#333333">a_sel</text>
<rect x="570" y="300" width="56" height="40" rx="6" fill="#f5f5f5" stroke="#777777" stroke-dasharray="6,4"/>
<text x="598.0" y="318" text-anchor="middle" font-weight="bold" fill="#333333">b_sel</text>
<rect x="670" y="240" width="140" height="100" rx="6" fill="#eef4fb" stroke="#33597f"/>
<text x="740.0" y="258" text-anchor="middle" font-weight="bold" fill="#1d3b5c">alu</text>
<text x="740.0" y="276" text-anchor="middle" fill="#555" font-size="11">a_i, b_i, op_i, word_i</text>
<text x="740.0" y="291" text-anchor="middle" fill="#555" font-size="11">r_o: result,</text>
<text x="740.0" y="306" text-anchor="middle" fill="#555" font-size="11">address, jump target</text>
<rect x="670" y="390" width="140" height="70" rx="6" fill="#fbf1ea" stroke="#8a4a23"/>
<text x="740.0" y="408" text-anchor="middle" font-weight="bold" fill="#5e2f12">branch_unit</text>
<text x="740.0" y="426" text-anchor="middle" fill="#555" font-size="11">a = rs1, b = rs2</text>
<text x="740.0" y="441" text-anchor="middle" fill="#555" font-size="11">taken_o</text>
<rect x="870" y="240" width="120" height="100" rx="6" fill="#f4eefb" stroke="#5d3f86"/>
<text x="930.0" y="258" text-anchor="middle" font-weight="bold" fill="#3d2766">lsu</text>
<text x="930.0" y="276" text-anchor="middle" fill="#555" font-size="11">wdata, wstrb</text>
<text x="930.0" y="291" text-anchor="middle" fill="#555" font-size="11">load_data</text>
<text x="930.0" y="306" text-anchor="middle" fill="#555" font-size="11">misaligned</text>
<rect x="1050" y="240" width="80" height="100" rx="6" fill="#f5f5f5" stroke="#777777" stroke-dasharray="6,4"/>
<text x="1090.0" y="258" text-anchor="middle" font-weight="bold" fill="#333333">data</text>
<text x="1090.0" y="276" text-anchor="middle" fill="#555" font-size="11">memory</text>
<rect x="870" y="390" width="120" height="56" rx="6" fill="#f5f5f5" stroke="#777777" stroke-dasharray="6,4"/>
<text x="930.0" y="408" text-anchor="middle" font-weight="bold" fill="#333333">wb_sel</text>
<text x="930.0" y="426" text-anchor="middle" fill="#555" font-size="11">ALU/MEM/PC+4/MD</text>
<rect x="20" y="400" width="200" height="60" rx="6" fill="#f5f5f5" stroke="#777777" stroke-dasharray="6,4"/>
<text x="120.0" y="418" text-anchor="middle" font-weight="bold" fill="#333333">next-PC select</text>
<text x="120.0" y="436" text-anchor="middle" fill="#555" font-size="11">pc+4 | target (alu r_o) | taken</text>
<polyline points="100,255 130,255" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
