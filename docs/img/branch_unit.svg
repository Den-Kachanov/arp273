<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 228" width="830" height="228" font-family="DejaVu Sans, sans-serif" font-size="13">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="830" height="228" fill="#ffffff"/>
<text x="415.0" y="24" text-anchor="middle" fill="#222" font-size="16" font-weight="bold">branch_unit</text>
<text x="415.0" y="42" text-anchor="middle" fill="#555" font-size="11">combinational; branch condition by funct3</text>
<rect x="230" y="60" width="300" height="158" rx="6" fill="#fbf1ea" stroke="#8a4a23"/>
<text x="380.0" y="78" text-anchor="middle" font-weight="bold" fill="#5e2f12"></text>
<text x="380.0" y="84" text-anchor="middle" fill="#333" font-size="11">000 BEQ   a == b</text>
<text x="380.0" y="100" text-anchor="middle" fill="#333" font-size="11">001 BNE   a != b</text>
<text x="380.0" y="116" text-anchor="middle" fill="#333" font-size="11">100 BLT   signed &lt;</text>
<text x="380.0" y="132" text-anchor="middle" fill="#333" font-size="11">101 BGE   signed &gt;=</text>
<text x="380.0" y="148" text-anchor="middle" fill="#333" font-size="11">110 BLTU  unsigned &lt;</text>
<text x="380.0" y="164" text-anchor="middle" fill="#333" font-size="11">111 BGEU  unsigned &gt;=</text>
<text x="380.0" y="180" text-anchor="middle" fill="#333" font-size="11">010, 011: taken = 0</text>
<text x="380.0" y="196" text-anchor="middle" fill="#333" font-size="11">branch_o from the decoder is applied outside</text>
<polyline points="130,86 230,86" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="126" y="80" text-anchor="end" fill="#222" font-size="12">a_i  (rs1)</text>
<text x="224" y="80" text-anchor="end" fill="#777" font-size="10">XLEN</text>
<polyline points="130,116 230,116" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="126" y="110" text-anchor="end" fill="#222" font-size="12">b_i  (rs2)</text>
<text x="224" y="110" text-anchor="end" fill="#777" font-size="10">XLEN</text>
<polyline points="130,146 230,146" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="126" y="140" text-anchor="end" fill="#222" font-size="12">funct3_i</text>
<text x="224" y="140" text-anchor="end" fill="#777" font-size="10">3</text>
<polyline points="530,86 590,86" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="598" y="90" text-anchor="start" fill="#222" font-size="12">taken_o</text>
<text x="536" y="80" text-anchor="start" fill="#777" font-size="10">1</text>
</svg>
