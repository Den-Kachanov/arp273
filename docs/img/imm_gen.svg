<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 212" width="830" height="212" font-family="DejaVu Sans, sans-serif" font-size="13">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="830" height="212" fill="#ffffff"/>
<text x="415.0" y="24" text-anchor="middle" fill="#222" font-size="16" font-weight="bold">imm_gen</text>
<text x="415.0" y="42" text-anchor="middle" fill="#555" font-size="11">combinational; five formats, sign extension from bit 31</text>
<rect x="230" y="60" width="300" height="142" rx="6" fill="#eef4fb" stroke="#33597f"/>
<text x="380.0" y="78" text-anchor="middle" font-weight="bold" fill="#1d3b5c"></text>
<text x="380.0" y="84" text-anchor="middle" fill="#333" font-size="11">case sel_i:</text>
<text x="380.0" y="100" text-anchor="middle" fill="#333" font-size="11">I  inst[31:20]</text>
<text x="380.0" y="116" text-anchor="middle" fill="#333" font-size="11">S  {inst[31:25], inst[11:7]}</text>
<text x="380.0" y="132" text-anchor="middle" fill="#333" font-size="11">B  {inst[31], inst[7], inst[30:25], inst[11:8], 0}</text>
<text x="380.0" y="148" text-anchor="middle" fill="#333" font-size="11">U  {inst[31:12], 12&#x27;b0}</text>
<text x="380.0" y="164" text-anchor="middle" fill="#333" font-size="11">J  {inst[31], inst[19:12], inst[20], inst[30:21], 0}</text>
<text x="380.0" y="180" text-anchor="middle" fill="#333" font-size="11">upper bits: copies of inst[31]; otherwise imm_o = 0</text>
<polyline points="130,86 230,86" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="126" y="80" text-anchor="end" fill="#222" font-size="12">inst_i</text>
<text x="224" y="80" text-anchor="end" fill="#777" font-size="10">32</text>
<polyline points="130,116 230,116" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="126" y="110" text-anchor="end" fill="#222" font-size="12">sel_i</text>
<text x="224" y="110" text-anchor="end" fill="#777" font-size="10">3</text>
<polyline points="530,86 590,86" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="598" y="90" text-anchor="start" fill="#222" font-size="12">imm_o</text>
<text x="536" y="80" text-anchor="start" fill="#777" font-size="10">XLEN</text>
</svg>
