<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 410" width="830" height="410" font-family="DejaVu Sans, sans-serif" font-size="13">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="830" height="410" fill="#ffffff"/>
<text x="415.0" y="24" text-anchor="middle" fill="#222" font-size="16" font-weight="bold">decoder</text>
<text x="415.0" y="42" text-anchor="middle" fill="#555" font-size="11">combinational; input: instruction, outputs: datapath control</text>
<rect x="230" y="60" width="300" height="340" rx="6" fill="#f3f7ee" stroke="#4b6b2f"/>
<text x="380.0" y="78" text-anchor="middle" font-weight="bold" fill="#2f4a1b"></text>
<text x="380.0" y="84" text-anchor="middle" fill="#333" font-size="11">case on inst[6:0] (opcode)</text>
<text x="380.0" y="100" text-anchor="middle" fill="#333" font-size="11">OP, OP-32: op = {funct7[5], funct3}</text>
<text x="380.0" y="116" text-anchor="middle" fill="#333" font-size="11">OP-IMM: top bit of op = 0,</text>
<text x="380.0" y="132" text-anchor="middle" fill="#333" font-size="11">  except SRAI</text>
<text x="380.0" y="148" text-anchor="middle" fill="#333" font-size="11">illegal_o = 1 by default,</text>
<text x="380.0" y="164" text-anchor="middle" fill="#333" font-size="11">  cleared for legal encodings</text>
<text x="380.0" y="180" text-anchor="middle" fill="#333" font-size="11">illegal: every we, branch, jal, jalr = 0</text>
<text x="380.0" y="196" text-anchor="middle" fill="#333" font-size="11">RV64-only (LD, SD, LWU, W): illegal for XLEN=32</text>
