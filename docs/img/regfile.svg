<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 260" width="830" height="260" font-family="DejaVu Sans, sans-serif" font-size="13">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="830" height="260" fill="#ffffff"/>
<text x="415.0" y="24" text-anchor="middle" fill="#222" font-size="16" font-weight="bold">regfile</text>
<text x="415.0" y="42" text-anchor="middle" fill="#555" font-size="11">32 registers × XLEN; write on the clock edge, combinational read</text>
<rect x="230" y="60" width="300" height="190" rx="6" fill="#f5f5f5" stroke="#777777"/>
<text x="380.0" y="78" text-anchor="middle" font-weight="bold" fill="#333333"></text>
<text x="380.0" y="84" text-anchor="middle" fill="#333" font-size="11">mem[1:31]: x0 not stored, no reset</text>
<text x="380.0" y="100" text-anchor="middle" fill="#333" font-size="11">write: we_i &amp;&amp; waddr_i != 0</text>
<text x="380.0" y="116" text-anchor="middle" fill="#333" font-size="11">read, by priority:</text>
<text x="380.0" y="132" text-anchor="middle" fill="#333" font-size="11">  1. address 0 -&gt; 0</text>
<text x="380.0" y="148" text-anchor="middle" fill="#333" font-size="11">  2. this register written this cycle -&gt; wdata_i</text>
<text x="380.0" y="164" text-anchor="middle" fill="#333" font-size="11">  3. otherwise mem[address]</text>
<polyline points="130,86 230,86" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="126" y="80" text-anchor="end" fill="#222" font-size="12">clk_i</text>
<text x="224" y="80" text-anchor="end" fill="#777" font-size="10">1</text>
<polyline points="130,116 230,116" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="126" y="110" text-anchor="end" fill="#222" font-size="12">we_i</text>
<text x="224" y="110" text-anchor="end" fill="#777" font-size="10">1</text>
<polyline points="130,146 230,146" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="126" y="140" text-anchor="end" fill="#222" font-size="12">waddr_i</text>
<text x="224" y="140" text-anchor="end" fill="#777" font-size="10">5</text>
<polyline points="130,176 230,176" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="126" y="170" text-anchor="end" fill="#222" font-size="12">wdata_i</text>
<text x="224" y="170" text-anchor="end" fill="#777" font-size="10">XLEN</text>
<polyline points="130,206 230,206" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="126" y="200" text-anchor="end" fill="#222" font-size="12">raddr1_i</text>
<text x="224" y="200" text-anchor="end" fill="#777" font-size="10">5</text>
<polyline points="130,236 230,236" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="126" y="230" text-anchor="end" fill="#222" font-size="12">raddr2_i</text>
<text x="224" y="230" text-anchor="end" fill="#777" font-size="10">5</text>
<polyline points="530,86 590,86" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="598" y="90" text-anchor="start" fill="#222" font-size="12">rdata1_o</text>
<text x="536" y="80" text-anchor="start" fill="#777" font-size="10">XLEN</text>
<polyline points="530,116 590,116" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="598" y="120" text-anchor="start" fill="#222" font-size="12">rdata2_o</text>
<text x="536" y="110" text-anchor="start" fill="#777" font-size="10">XLEN</text>
</svg>
